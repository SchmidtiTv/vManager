name: CI

on:
  pull_request:
    branches: [main]
  # New advisories land without any change here, so check weekly as well.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Reads Cargo metadata only — it never builds or runs vManager, so the
  # runner OS is irrelevant and the cheapest one is fine.
  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
